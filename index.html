<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Tree</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Class Tree <span id="major-label"></span></h1>
    <div class="controls">
      <select id="major-select"></select>
      <div class="track-control">
        <select id="track-select"></select>
        <button id="track-info-toggle" hidden aria-expanded="false" aria-label="About this track">?</button>
        <div id="track-info-panel" hidden></div>
      </div>
    </div>
    <div class="progress">
      <div id="progress-text">0 / 0 credits checked</div>
      <div class="progress-bar"><div id="progress-fill"></div></div>
    </div>
  </header>

  <div id="selection-bar" hidden>
    <span id="selection-text"></span>
    <button id="selection-clear">✕ Clear</button>
  </div>

  <div id="tree-wrap">
    <div id="tree">
      <svg id="edges"></svg>
    </div>
  </div>

  <footer id="footer"></footer>

  <div id="legend-widget">
    <button id="legend-toggle" aria-expanded="false" aria-label="Show legend">?</button>
    <div id="legend-panel" hidden></div>
  </div>

  <div id="cart-widget">
    <button id="cart-toggle" aria-expanded="false" aria-label="Quarter planning cart">
      🛒 <span id="cart-count">0</span>
    </button>
    <div id="cart-panel" hidden>
      <div class="cart-panel-header">
        <strong>Plan a quarter</strong>
        <button id="cart-clear">Clear</button>
      </div>
      <div class="cart-hint">
        Add courses here to check whether they can be taken the <em>same</em> quarter — based on prerequisite chains only.
        This can't see actual class meeting times, so still double-check the real time schedule for conflicts.
      </div>
      <div id="cart-items"></div>
    </div>
  </div>

  <div id="course-modal-backdrop" hidden>
    <div id="course-modal" role="dialog" aria-modal="true">
      <button id="course-modal-close" aria-label="Close">✕</button>
      <div id="course-modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
